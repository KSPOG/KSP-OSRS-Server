name: Server coordinator smoke tests
on:
  push:
    branches: [server]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify discovery, lifecycle, sockets and persistence
        shell: bash
        env:
          KSP_ADMIN_TOKEN: local-ci-token-very-long-123456789
          KSP_WORLD_STATE_FILE: data/ci-world-states.properties
        run: |
          set -euo pipefail
          cd server
          mkdir -p build/classes
          javac --release 21 -d build/classes src/main/java/dev/ksp/osrs/*.java
          start_server() {
            java -cp build/classes dev.ksp.osrs.ServerMain config/worlds.csv > ci.log 2>&1 &
            PID=$!
            for attempt in {1..30}; do
              if curl --silent --fail http://localhost:8087/health >/dev/null; then return; fi
              sleep 1
            done
            cat ci.log; exit 1
          }
          stop_server() { kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; }
          trap 'stop_server' EXIT
          check_port() {
            python3 - "$1" "$2" <<'PY'
          import socket,sys
          port=int(sys.argv[1]); expected=sys.argv[2]=='open'
          with socket.socket() as sock:
              sock.settimeout(.5)
              active=sock.connect_ex(('127.0.0.1',port))==0
          assert active==expected,(port,expected,active)
          PY
          }
          start_server
          curl --fail --silent http://localhost:8087/client/manifest | grep -q '"gameProtocolReady":false'
          curl --fail --silent -H "Authorization: Bearer $KSP_ADMIN_TOKEN" http://localhost:8087/admin/api/worlds | grep -q '"listenerActive":true'
          check_port 43301 open
          check_port 43308 closed
          curl --fail --silent -X POST -H "Authorization: Bearer $KSP_ADMIN_TOKEN" http://localhost:8087/admin/api/worlds/301/stop | grep -q '"running":false'
          check_port 43301 closed
          grep -q 'world.301=false' "$KSP_WORLD_STATE_FILE"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8087/admin/api/worlds/301/start)
          test "$STATUS" = "401"
          stop_server
          sleep 1
          start_server
          check_port 43301 closed
          curl --fail --silent -X POST -H "Authorization: Bearer $KSP_ADMIN_TOKEN" http://localhost:8087/admin/api/worlds/301/start | grep -q '"running":true'
          check_port 43301 open
