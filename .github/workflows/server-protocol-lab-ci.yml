name: Revision 242 protocol dependency laboratory
on:
  push:
    branches: [server]
    paths:
      - 'server/protocol-lab/**'
      - '.github/workflows/server-protocol-lab-ci.yml'
  workflow_dispatch:
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and resolve pinned RSProt 242
        working-directory: server/protocol-lab
        shell: bash
        run: gradle compileJava verifyProtocolDependencies run testCacheReader testReferenceTables testCacheMetadata testCacheIntegrity testJs5Provider testJs5WireFraming testJs5HandshakePayload --no-daemon --stacktrace
