name: Microbot private profile smoke tests
on:
  push:
    branches: [client]
  pull_request:
    branches: [client]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify configuration and discovery guard
        shell: bash
        run: |
          set -euo pipefail
          cd Microbot-main/runelite-client
          mkdir -p build/ksp-profile-tests
          javac --release 21 -d build/ksp-profile-tests \
            src/main/java/net/runelite/client/plugins/microbot/KspPrivateServerConfig.java \
            src/main/java/net/runelite/client/plugins/microbot/KspServerDiscovery.java \
            src/test/java/net/runelite/client/plugins/microbot/KspPrivateServerConfigSmokeTest.java \
            src/test/java/net/runelite/client/plugins/microbot/KspServerDiscoverySmokeTest.java
          java -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspPrivateServerConfigSmokeTest
          java -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspServerDiscoverySmokeTest
          grep -q 'KSP_OSRS_REVISION' src/main/java/net/runelite/client/rs/ClientLoader.java
          grep -q 'KspServerDiscovery.verifyReady()' src/main/java/net/runelite/client/rs/ClientLoader.java

      - name: Check isolated gamepack JS5 probe configuration
        shell: bash
        run: |
          set -euo pipefail
          cd Microbot-main/runelite-client
          javac --release 21 -cp build/ksp-profile-tests -d build/ksp-profile-tests \
            src/main/java/net/runelite/client/plugins/microbot/KspJs5GamepackProbeConfig.java \
            src/main/java/net/runelite/client/plugins/microbot/KspJs5LoopbackGuard.java \
            src/test/java/net/runelite/client/plugins/microbot/KspJs5GamepackProbeConfigSmokeTest.java
          java -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspJs5GamepackProbeConfigSmokeTest
          KSP_OSRS_JS5_GAMEPACK_PROBE=true KSP_OSRS_JS5_PROBE_PORT=43594 \
            KSP_OSRS_JS5_LOCAL_JAV_CONFIG_URL=http://127.0.0.1:43595/jav_config.ws \
            java -Djava.security.manager=allow -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspJs5GamepackProbeConfigSmokeTest --enabled
          grep -q 'KspJs5GamepackProbeConfig.codeBase' src/main/java/net/runelite/client/rs/RSAppletStub.java
          grep -q 'KspJs5GamepackProbeConfig.parameter' src/main/java/net/runelite/client/rs/RSAppletStub.java
          grep -q 'KspJs5GamepackProbeConfig.codeBase' src/main/java/net/runelite/client/plugins/microbot/MicrobotRSAppletStub.java
          grep -q 'KspJs5GamepackProbeConfig.parameter' src/main/java/net/runelite/client/plugins/microbot/MicrobotRSAppletStub.java
          grep -q 'KSP_JS5_GPU_DISABLED' src/main/java/net/runelite/client/RuneLite.java
          grep -q 'pluginManager.setPluginEnabled(plugin, false)' src/main/java/net/runelite/client/RuneLite.java
          grep -q 'args("--safe-mode")' build.gradle.kts
          grep -q 'KspJs5LoopbackGuard.install' src/main/java/net/runelite/client/RuneLite.java
          grep -q 'java.security.manager=allow' build.gradle.kts
          grep -q 'loadInSafeMode = false' src/main/java/net/runelite/client/plugins/gpu/GpuPlugin.java

      - name: Compile isolated JS5 client-branch diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd Microbot-main/runelite-client
          javac --release 21 -d build/ksp-profile-tests \
            src/main/java/net/runelite/client/plugins/microbot/KspJs5ConnectionProbe.java
          echo "KspJs5ConnectionProbe compilation: PASS"
