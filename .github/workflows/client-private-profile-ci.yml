name: Microbot private profile smoke tests
on:
  push:
    branches: [client]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify configuration and discovery guard
        shell: bash
        run: |
          set -euo pipefail
          cd Microbot-main/runelite-client
          mkdir -p build/ksp-profile-tests
          javac --release 21 -d build/ksp-profile-tests \
            src/main/java/net/runelite/client/plugins/microbot/KspPrivateServerConfig.java \
            src/main/java/net/runelite/client/plugins/microbot/KspServerDiscovery.java \
            src/test/java/net/runelite/client/plugins/microbot/KspPrivateServerConfigSmokeTest.java \
            src/test/java/net/runelite/client/plugins/microbot/KspServerDiscoverySmokeTest.java
          java -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspPrivateServerConfigSmokeTest
          java -cp build/ksp-profile-tests net.runelite.client.plugins.microbot.KspServerDiscoverySmokeTest
          grep -q 'KSP_OSRS_REVISION' src/main/java/net/runelite/client/rs/ClientLoader.java
          grep -q 'KspServerDiscovery.verifyReady()' src/main/java/net/runelite/client/rs/ClientLoader.java

      - name: Compile isolated JS5 client-branch diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cd Microbot-main/runelite-client
          javac --release 21 -d build/ksp-profile-tests \
            src/main/java/net/runelite/client/plugins/microbot/KspJs5ConnectionProbe.java
          echo "KspJs5ConnectionProbe compilation: PASS"
