name: JS5 protocol-lab synthetic verification

on:
  push:
    branches:
      - feature/js5-master-reference-comparator
  pull_request:
    paths:
      - 'server/protocol-lab/**'
      - 'server/tools/js5_master_capture_proxy.py'
      - 'server/tools/test_js5_master_capture_proxy.py'
      - '.github/workflows/js5-protocol-lab.yml'

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/protocol-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and test all offline protocol components
        run: |
          gradle --no-daemon clean \
            testCacheReader testReferenceTables testCacheMetadata \
            testCacheIntegrity testJs5Provider testJs5WireFraming \
            testJs5HandshakePayload testJs5MasterReferenceComparator \
            testRevision242MetadataAudit testExhaustiveCacheAudit \
            testJs5OfflineExchange testJs5MasterWireFixtureAudit testJs5HandshakeDiagnostic \
            testJs5HandshakeRequestStream

      - name: Python localhost capture proxy regression tests
        run: python3 -m unittest -v test_js5_master_capture_proxy.py
        working-directory: server/tools
