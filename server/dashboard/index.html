<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KSP World Control</title><style>:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#101827;color:#e7ecf8}body{margin:0}header{padding:22px 5%;background:#172339}main{max-width:920px;margin:34px auto;padding:0 20px}.panel{background:#19263c;border:1px solid #344563;border-radius:14px;padding:20px;margin:18px 0}button,input{padding:11px;border-radius:8px;font:inherit}button{background:#5279ec;border:0;color:white;cursor:pointer}button.stop{background:#953f52}input{background:#0c1728;color:white;border:1px solid #456181;max-width:100%}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #344563;padding:16px 0}.muted{color:#adbad1}</style></head><body><header><strong>KSP OSRS — World Control</strong></header><main><h1>World management</h1><p><a href="/admin/bank" style="color:#a4baff">Open player bank administration</a></p><p class="muted">F2P and P2P world listeners, tick counters, and persistent lifecycle controls. The OSRS game protocol is not implemented.</p><div class="panel"><input type="password" id="token" placeholder="Admin token"><button id="connect">Connect</button><button id="refresh">Refresh</button><p id="message" role="status"></p></div><div class="panel"><h2>Worlds</h2><div id="worlds">Connect to load worlds.</div></div></main><script>(()=>{let token='';const $=id=>document.getElementById(id);async function api(path,method='GET'){const r=await fetch('/admin/api'+path,{method,headers:{Authorization:'Bearer '+token}}),v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}async function refresh(){try{const worlds=await api('/worlds'),root=$('worlds');root.replaceChildren();for(const w of worlds){const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.textContent='World '+w.id+' · '+w.type+' · '+(w.listenerActive?'TCP active':'TCP closed')+' · port '+w.tcpPort+' · '+w.ticks+' ticks · '+w.population+'/'+w.capacity;const b=document.createElement('button');b.className=w.running?'stop':'';b.textContent=w.running?'Stop':'Start';b.onclick=async()=>{if(w.running&&!confirm('Stop world '+w.id+'?'))return;b.disabled=true;try{await api('/worlds/'+w.id+'/'+(w.running?'stop':'start'),'POST');await refresh()}catch(e){$('message').textContent=e.message;b.disabled=false}};row.append(label,b);root.append(row)}$('message').textContent=worlds.length+' worlds loaded'}catch(e){$('message').textContent=e.message}}$('connect').onclick=()=>{token=$('token').value;$('token').value='';refresh()};$('refresh').onclick=refresh})();</script></body></html>
