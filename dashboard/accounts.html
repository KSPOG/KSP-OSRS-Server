<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game accounts | KSP OSRS</title>
<style>
:root{color-scheme:dark;font:16px Inter,system-ui,sans-serif;background:#101620;color:#e9eef5}
main{max-width:860px;margin:3rem auto;padding:1.5rem}form{display:flex;align-items:end;gap:.75rem;flex-wrap:wrap}
label{display:grid;gap:.375rem}input,button{padding:.65rem;font:inherit;border:1px solid #536783;border-radius:6px}
button{background:#355e94;color:white;cursor:pointer}a{color:#a5c6ff}
table{width:100%;border-collapse:collapse}th,td{padding:.8rem;text-align:left;border-bottom:1px solid #344257}
</style>
</head>
<body><main>
<nav><a href="/admin">World dashboard</a> · <a href="/register">Create game account</a></nav>
<h1>Game accounts</h1>
<form id="connect">
<label>Admin token <input id="token" type="password" required autocomplete="off"></label>
<button>Load accounts</button>
</form>
<p id="status" role="status">Enter the token shown in the server window.</p>
<table><thead><tr><th scope="col">Username</th><th scope="col">Access</th><th scope="col">Membership</th></tr></thead>
<tbody id="accounts"></tbody></table>
</main>
<script>
const status = document.getElementById('status');
const list = document.getElementById('accounts');
const token = document.getElementById('token');
async function request(path = '', method = 'GET') {
    const response = await fetch('/admin/api/accounts' + path, {
        method, headers: {Authorization: 'Bearer ' + token.value}
    });
    if (!response.ok) throw new Error(await response.text());
    return method === 'GET' ? response.json() : response.text();
}
async function refresh(message) {
    try {
        const accounts = await request();
        list.replaceChildren(...accounts.map(account => {
            const row = document.createElement('tr');
            row.insertCell().textContent = account.username;
            row.insertCell().textContent = account.member ? 'Members' : 'Free-to-play';
            const button = document.createElement('button');
            button.textContent = account.member ? 'Remove membership' : 'Grant membership';
            button.addEventListener('click', async () => {
                button.disabled = true;
                try {
                    const action = account.member ? 'free' : 'members';
                    await refresh(await request('/' + encodeURIComponent(account.username) + '/' + action, 'POST'));
                } catch (error) {
                    status.textContent = error.message;
                    button.disabled = false;
                }
            });
            row.insertCell().append(button);
            return row;
        }));
        status.textContent = message || accounts.length + ' registered account(s)';
    } catch (error) {
        list.replaceChildren();
        status.textContent = error.message;
    }
}
document.getElementById('connect').addEventListener('submit', event => {
    event.preventDefault();
    refresh();
});
</script>
</body>
</html>
